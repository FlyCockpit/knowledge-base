# Disposable KB integration fixtures. Always invoked with a unique
# COMPOSE_PROJECT_NAME / `-p` so concurrent suites cannot share resources.
# Third-party images use the approved digest pins (2026-11-04).
name: kb-test

services:
  postgres:
    profiles: [postgres]
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    # Non-UTC server default session TimeZone (scripts/test-kb.mjs supplies a
    # zone distinct from the Node TZ) so session-offset bugs stay visible.
    command: ["postgres", "-c", "timezone=${KB_TEST_PG_TIMEZONE:-Pacific/Kiritimati}"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KB_TEST_PG_PASSWORD:-kb-test-unused}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      # Restore retains a bounded suite's source and imported databases until
      # container teardown; include room for their catalogs and checkpoint WAL.
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    mem_limit: 768m
    init: true

  redis:
    profiles: [redis]
    image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "32mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1::6379"
    tmpfs:
      - /data:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 64m
    init: true
