# Trivy ignore file for the image scans (build-image.yml, pr-checks.yml,
# release.yml pass it via `trivyignores`). Every entry is scoped by `paths` to
# the two pinned age binaries and expires; an expired entry stops applying and
# the scan fails again. Tracked in CONTRIBUTING.md § Test baseline.
vulnerabilities:
  - id: CVE-2026-111943
    paths:
      - usr/local/bin/age
      - usr/local/bin/age-keygen
    statement: age does no networking; upstream v1.3.2 binaries built with Go 1.27.0; drop when age ships binaries built with a patched Go
    expired_at: 2027-01-17
