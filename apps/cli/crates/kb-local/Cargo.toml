# Never shipped as its own release artifact.
[package.metadata.dist]
dist = false

[lints.rust]
# Audited OS boundaries (child fd handoff, Windows process/ACL) and the static sqlite-vec registration.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
