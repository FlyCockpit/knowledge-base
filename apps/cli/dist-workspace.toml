[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Linux ships fully static musl binaries (no glibc floor, no ELF interpreter),
# built in apps/cli/ci/musl-builder.Dockerfile with llama.cpp's OpenMP kept.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Additional legal notices are resolved relative to this config file.
# Existing LICENSE-APACHE/README auto-includes remain enabled.
include = ["../../LICENSE", "../../NOTICE", "../../THIRD-PARTY-LICENSES.md"]
publish-jobs = []
# The root release.yml is hand-maintained (see docs/releasing.md), so skip
# cargo-dist's generated-workflow freshness check; review dist changes by hand.
allow-dirty = ["ci"]
# The root manual Release workflow consumes this config from the monorepo root.
# Pull-request cargo-dist runs are plan-only when generated locally.
pr-run-mode = "plan"
# Release requests must pass the root release-preflight workflow before
# artifacts build.
plan-jobs = ["./release-preflight"]

[dist.github-custom-runners]
global = "ubuntu-latest"
# The Linux musl binaries are static, so the runner image no longer sets a
# glibc floor; the build itself runs in the digest-pinned Alpine builder
# container (release.yml "Build artifacts"), the runner only hosts Docker.
x86_64-unknown-linux-musl = "ubuntu-latest"
# GitHub has no `ubuntu-latest` label for arm64; pin the native arm64 image.
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"

# CPU embedding bindings build native code; no weights are release assets.
[dist.dependencies.apt]
cmake = '*'
libclang-dev = '*'
"g++" = "*"

# Native macOS build dependencies installed by brew on the CI runners.
# These are independent of the release installer formats.
[dist.dependencies.homebrew]
cmake = '*'
llvm = '*'
libomp = '*'
