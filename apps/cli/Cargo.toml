# ─────────────────────────────────────────────────────────────────────────────
# Companion Rust CLI (`apps/cli`). Keep the package name and [[bin]] name
# aligned so release artifacts and `assert_cmd` tests use the same executable.
# ─────────────────────────────────────────────────────────────────────────────

[package]
name = "kb"
version = "1.0.0"
edition = "2024"
publish = false
# Minimum Supported Rust Version, shared by every workspace package through
# `[workspace.package]` below. The `msrv` CI lane pins the exact toolchain
# (1.96.1) and runs the full test suite on it.
rust-version.workspace = true
description = "Knowledge-base CLI and local MCP server"
authors = ["FlyCockpit LLC"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FlyCockpit/knowledge-base"
homepage = "https://github.com/FlyCockpit/knowledge-base"
documentation = "https://github.com/FlyCockpit/knowledge-base/tree/main/apps/cli#readme"
keywords = ["cli", "command-line"]
categories = ["command-line-utilities"]
# Files NOT shipped in the crates.io tarball (keeps `cargo publish` lean and
# avoids leaking agent/dev scaffolding to package consumers).
exclude = [
    "tap/",
    "AGENTS.md",
    "CLAUDE.md",
]

[package.metadata.dist]
dist = true

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
kb-client = { path = "crates/kb-client", version = "1.0.0" }
kb-local = { path = "crates/kb-local", version = "1.0.0" }
# Reuse the existing workspace transport/crypto crates; no new third-party
# crate. Match kb-client's rustls-only, explicit-provider HTTP configuration.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54.1", features = ["rt", "time", "net", "io-util", "io-std", "signal"] }
ring = "0.17.14"
zeroize = { version = "1.9.1", features = ["serde"] }
# Error handling. anyhow for application code (rich context, easy `?`). Reach
# for `thiserror` only when you publish a library with a stable error API; see
# docs/error-handling.md.
anyhow = "1.0.104"
# Argument parsing + shell completions.
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
# Cross-platform config/data directories (XDG on Linux, the right spots
# on macOS and Windows).
dirs = "7.0.0"
# Serialization. serde_json powers `--json` output; toml powers the human-edited
# config file.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Temporary files for atomic config writes.
tempfile = "3.27.0"
toml = "1.2.1"
# Structured logging. `--log-format`, `RUST_LOG`/`KB_LOG` filtering.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.23.1"

[dev-dependencies]
# Existing Tokio only: virtual deadlines do not depend on host scheduling.
tokio = { version = "1.54.1", features = ["test-util"] }
# Black-box CLI testing: run the built binary and assert on stdout/stderr/exit.
assert_cmd = "2.2.2"
predicates = "3.1.4"
# Reuse the bundled SQLite (same build as kb-local) for real host lifecycle fixtures.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }

# ── Lints ────────────────────────────────────────────────────────────────────
# Centralized lint policy. CI runs clippy with `-D warnings`, so anything `warn`
# here fails the build in CI but stays a warning locally. Edit deliberately.
[lints.rust]
# No `unsafe` in a CLI like this — if you genuinely need it, change this to
# "deny" and gate each block with a `// SAFETY:` comment.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Guardrails that catch the bad decisions agents most often make:
unwrap_used = "warn"        # prefer `?`/`expect("why")` over silent panics
expect_used = "allow"       # `expect` with a reason is fine; flip to warn if strict
todo = "warn"               # don't ship `todo!()`
dbg_macro = "warn"          # don't ship `dbg!()`
print_stdout = "warn"       # use `src/output.rs` so stdout stays deliberate
print_stderr = "warn"       # use tracing or structured error handling

# ── Release profile ──────────────────────────────────────────────────────────
# Optimized for small, fast distributed binaries. Used by `dist` for releases.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile `dist` uses for cutting releases (inherits release, kept separate
# so you can tune release builds without affecting local `cargo build --release`).
[profile.dist]
inherits = "release"

[workspace]
members = ["xtask", "crates/kb-client", "crates/kb-local"]
exclude = ["vendor/llama-cpp-2", "vendor/llama-cpp-sys-2"]

# Vendored CPU embedding-only bindings over the pinned llama.cpp v0.7.0 source.
[patch.crates-io]
llama-cpp-2 = { path = "vendor/llama-cpp-2" }
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }

[workspace.package]
rust-version = "1.96"
