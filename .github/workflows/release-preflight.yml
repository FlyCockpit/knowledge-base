# Pre-release gate for the companion Rust CLI (`apps/cli`). Called by
# release.yml before any artifacts are built; runs the same checks as cli-ci.yml
# in one job so a release can never ship from a red tree.
#
# Removing the CLI? Delete this file along with apps/cli — see
# apps/cli/AGENTS.md.
name: Release Preflight

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/cli

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Same native-build caps as cli-ci.yml: llama.cpp/cmake otherwise fans out
  # past the runner's memory.
  CARGO_BUILD_JOBS: 3
  CMAKE_BUILD_PARALLEL_LEVEL: 3

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      # Offline metadata traverses all platforms, including non-host dependencies.
      - run: cargo fetch --locked
      - run: node --test scripts/test-clean.test.mjs
      - run: node scripts/test-clean.mjs cargo test --workspace --all-targets --locked
      - run: node scripts/test-clean.mjs cargo test --workspace --doc --locked
      - run: cargo xtask sync-docs --check
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          arguments: --config apps/cli/deny.toml
          manifest-path: apps/cli/Cargo.toml
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: typos-cli@1.52.0
      - run: typos
      - run: bash scripts/policy-checks.sh
